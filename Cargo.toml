[workspace]
resolver = "3"
members = [
    "crates/pamin-core",
    "crates/pamin-store",
    "crates/pamin-index",
    "crates/pamin-engine",
    "crates/pamin-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
repository = "https://github.com/Pamin-Labs/PaminMemory"

[workspace.dependencies]
pamin-core = { path = "crates/pamin-core" }
pamin-engine = { path = "crates/pamin-engine" }
pamin-index = { path = "crates/pamin-index" }
pamin-store = { path = "crates/pamin-store" }

anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["serde-well-known"] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "time",
    # The resident server listens on a Unix domain socket.
    "net",
] }
# Line-delimited framing for that socket, and the Stream/Sink extension traits
# the framed transport is used through. Both were already compiled -- by
# `postgresql_embedded`'s download path -- so declaring them costs nothing and
# stops the build depending on that staying true.
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
# image-models is on by default and pulls a full image codec stack, including
# an AVIF encoder, for models we do not use.
fastembed = { version = "6", default-features = false, features = [
    "ort-download-binaries-native-tls",
    "hf-hub-native-tls",
] }
icu_segmenter = { version = "2", features = ["compiled_data", "auto"] }
# Not used directly: icu4x reference-counts its compiled data with `Rc` unless
# this is on, which makes every segmenter -- and so every index that holds one
# -- unable to cross a thread. `icu_segmenter` does not forward the feature, so
# it is enabled here.
icu_provider = { version = "2", features = ["sync"] }
postgresql_embedded = { version = "0.21", features = ["tokio"] }
# No `macros`: `sqlx::migrate!()` needs it and pulls the offline-data machinery
# and a `.env` scan with it, while `Migrator::with_migrations` plus `include_str!`
# gives the same embedded migrations with none of that. TLS has to match what
# `postgresql_embedded` chose, or two TLS stacks end up in one binary.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-native-tls",
    "postgres",
    "migrate",
    "derive",
    "uuid",
    "time",
    "json",
] }
whatlang = "0.16"
zvec-rust = "0.7"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Release profile aims at the binary-size budget gate in CI.
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
