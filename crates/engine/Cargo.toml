[package]
name = "memory-engine"
description = "Composition of the pamin-memory store, index, and embedder."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
memory-core = { workspace = true }
memory-index = { workspace = true }
memory-store = { workspace = true }
anyhow = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
# For a memory's content hash, which `remember` computes because it is part of
# what recording a memory means. Already in the tree as `memory-cli`'s, so this
# adds no lockfile entry.
sha2 = { workspace = true }

[dev-dependencies]
# Capture the actual selected model paths in reproduction logs. Already used
# by the CLI; no new lockfile dependency.
tracing-subscriber = { workspace = true }
memory-store = { workspace = true }
hf-hub = { workspace = true }
# For the scale tests only, which build a project's topics in bulk rather than
# one round trip at a time. Already in the tree as `memory-store`'s driver, so
# this adds no lockfile entry.
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# The evaluation harness waits for an engine's outstanding model loads from a
# shape's drop, which cannot await. Already in the tree as `memory-cli`'s, so
# this adds no lockfile entry.
futures = { workspace = true }
