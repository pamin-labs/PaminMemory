[package]
name = "memory-client"
description = "The pamin command line's client half: its arguments, the wire protocol, and rendering."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# What the `pamin` executable is built from, so it must stay light: every
# dependency here is paid by every command an agent runs, at every start. In
# particular nothing here may reach `memory-index`, `memory-store` or
# `memory-engine` -- and through them the inference runtime, the vector engine,
# TLS and the database driver. `tests/light.rs` checks that.
[dependencies]
memory-core = { workspace = true }
memory-contract = { workspace = true }
# `pamin mcp`: the contract served as MCP over stdio. Without its `http`
# feature it builds no HTTP server.
pamin-kit = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# The protocol fingerprint `build.rs` stamps in; see there.
[build-dependencies]
sha2 = { workspace = true }

[dev-dependencies]
pamin-kit = { workspace = true, features = ["conformance"] }
tempfile = { workspace = true }
