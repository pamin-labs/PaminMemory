[package]
name = "pamin-engine"
description = "Composition of the PaminMemory store, index, and embedder."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pamin-core = { workspace = true }
pamin-index = { workspace = true }
pamin-store = { workspace = true }
anyhow = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
# For a memory's content hash, which `remember` computes because it is part of
# what recording a memory means. Already in the tree as `pamin-index`'s, so this
# adds no lockfile entry.
sha2 = { workspace = true }

[dev-dependencies]
# For the scale tests only, which build a project's topics in bulk rather than
# one round trip at a time. Already in the tree as `pamin-store`'s driver, so
# this adds no lockfile entry.
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
