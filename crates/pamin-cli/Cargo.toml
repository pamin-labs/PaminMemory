[package]
name = "pamin-cli"
description = "The pamin command line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Two executables, installed together. `pamin` is the command an agent runs,
# built from `pamin-client` alone so it links none of the engine; it starts
# `pamin-server`, the resident server, which links all of it. Both come from
# one package so one `cargo install` puts them side by side.
[[bin]]
name = "pamin"
path = "src/main.rs"

[[bin]]
name = "pamin-server"
path = "src/pamin_server.rs"

[dependencies]
pamin-client = { workspace = true }
pamin-core = { workspace = true }
pamin-engine = { workspace = true }
pamin-index = { workspace = true }
pamin-store = { workspace = true }
# Supply target-native links metadata to build.rs, including cross compilation.
zvec-rust-sys = { version = "0.7.2", features = ["bundled"] }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
ignore = { workspace = true }
notify = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
